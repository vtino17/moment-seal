name: Release evidence

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Build, inventory, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:deps
      - run: pnpm check
      - name: Package release bundle
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          bash scripts/package-release.sh "$GITHUB_REF_NAME" release
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: momentseal-${{ github.event.release.tag_name }}.cdx.json
          output-file: release/momentseal-${{ github.event.release.tag_name }}.cdx.json
          upload-artifact: true
          upload-release-assets: true
      - name: Attest build provenance and SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/momentseal-${{ github.event.release.tag_name }}.tar.gz
          sbom-path: release/momentseal-${{ github.event.release.tag_name }}.cdx.json
      - name: Upload bundle and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.tar.gz release/*.sha256 --clobber
