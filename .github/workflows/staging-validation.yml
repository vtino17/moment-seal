name: Staging validation

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub Environment containing staging configuration
        required: true
        type: environment

concurrency:
  group: staging-validation-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate protected staging services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target_environment }}
    env:
      MOMENTSEAL_INTEGRATION_PROVISION: "false"
      MOMENTSEAL_POSTGRES_URL: ${{ secrets.MOMENTSEAL_POSTGRES_URL }}
      MOMENTSEAL_VAULT_ADDR: ${{ vars.MOMENTSEAL_VAULT_ADDR }}
      MOMENTSEAL_VAULT_KEY_NAME: ${{ vars.MOMENTSEAL_VAULT_KEY_NAME }}
      MOMENTSEAL_VAULT_KEY_VERSION: ${{ vars.MOMENTSEAL_VAULT_KEY_VERSION }}
      MOMENTSEAL_VAULT_MOUNT: ${{ vars.MOMENTSEAL_VAULT_MOUNT }}
      MOMENTSEAL_VAULT_TOKEN: ${{ secrets.MOMENTSEAL_VAULT_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:deps
      - run: pnpm test:staging
